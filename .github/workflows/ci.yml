name: AgriEtech Backend CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: agrietech_user
          POSTGRES_PASSWORD: agrietech_password
          POSTGRES_DB: agrietech_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Test Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_token_123
          DATABASE_URL: postgresql://agrietech_user:agrietech_password@localhost:5432/agrietech_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
