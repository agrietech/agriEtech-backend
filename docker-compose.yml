version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: agrietech_postgres
    environment:
      POSTGRES_USER: agrietech_user
      POSTGRES_PASSWORD: agrietech_password
      POSTGRES_DB: agrietech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: agrietech_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
